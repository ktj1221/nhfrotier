<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NH 위드캔버스 · 프로젝트 문서 허브</title>
<style>
:root{
--nh-blue-700:#00689b;--nh-blue-600:#007ec0;--nh-blue-500:#0094d9;--nh-blue-300:#79c8ee;--nh-blue-100:#d6eefa;--nh-blue-50:#eef8fd;
--nh-navy-900:#0a2540;--nh-navy-800:#122f50;--nh-navy-700:#1d3d63;--nh-navy-500:#34507a;
--nh-slate-700:#353f5e;--nh-slate-600:#3f4a68;--nh-slate-500:#4a5677;
--nh-green-700:#007f3d;--nh-green-600:#009047;--nh-green-500:#00a04e;--nh-green-100:#d6f1e1;--nh-green-50:#ecf9f1;
--grey-900:#1a1c1f;--grey-800:#2b2f36;--grey-700:#41464f;--grey-600:#5b616b;--grey-500:#767d88;--grey-400:#9aa0aa;--grey-300:#c4c9d0;--grey-200:#e2e5ea;--grey-150:#eaedf1;--grey-100:#f0f2f5;--grey-50:#f5f6f8;--white:#fff;
--amber-600:#b26a00;--amber-100:#fdeecf;--amber-50:#fdf6e8;--red-600:#c22e22;--red-50:#fdecea;
--page:var(--grey-50);--card:var(--white);--sunken:var(--grey-100);
--tx-strong:var(--grey-900);--tx-body:var(--grey-700);--tx-muted:var(--grey-500);--tx-faint:var(--grey-400);
--bd-subtle:var(--grey-200);--bd:var(--grey-300);--bd-strong:var(--grey-400);
--rail:var(--white);--rail-bd:var(--grey-200);--rail-hover:var(--grey-100);--rail-active:var(--nh-blue-50);
--st-done-fg:var(--nh-green-700);--st-done-bg:var(--nh-green-50);--st-done-bd:var(--nh-green-100);--st-done-dot:var(--nh-green-500);
--st-part-fg:var(--amber-600);--st-part-bg:var(--amber-50);--st-part-bd:var(--amber-100);--st-part-dot:#e2a33a;
--st-todo-fg:var(--grey-500);--st-todo-bg:var(--grey-100);--st-todo-bd:var(--grey-200);--st-todo-dot:var(--grey-300);
--shadow-sm:0 1px 2px rgba(16,24,40,.05);--shadow-md:0 4px 14px rgba(16,24,40,.08);--shadow-lg:0 12px 32px rgba(10,37,64,.12);
--font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Nanum Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
--mono:"SFMono-Regular",Consolas,"D2Coding","Liberation Mono",Menlo,monospace;
--sb:296px;--toc:236px;
}
html[data-theme="dark"]{
--page:#0e1319;--card:#161c24;--sunken:#1c232c;
--tx-strong:#e8ecf1;--tx-body:#bcc5d0;--tx-muted:#8892a0;--tx-faint:#6b7480;
--bd-subtle:#252d38;--bd:#333d4a;--bd-strong:#454f5e;
--rail:#131920;--rail-bd:#242c37;--rail-hover:#1c232c;--rail-active:#15304a;
--nh-blue-50:#12283a;--nh-blue-100:#1a3a53;--nh-blue-600:#54b6e8;--nh-blue-500:#3aa8e0;--nh-blue-700:#7cc9ee;
--nh-green-50:#11291d;--nh-green-100:#1a3d2a;--nh-green-700:#4cc888;--nh-green-600:#3cbb79;
--amber-50:#2b220f;--amber-100:#3d3116;--amber-600:#e0b055;--red-50:#331917;--red-600:#f08a80;
--grey-100:#1c232c;--grey-150:#222a34;--grey-50:#161c24;
--st-todo-fg:#8892a0;--st-todo-bg:#1c232c;--st-todo-bd:#252d38;--st-todo-dot:#3c4552;
--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-md:0 4px 14px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--tx-body);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:var(--nh-blue-600);text-decoration:none}
a:hover{color:var(--nh-blue-700);text-decoration:underline}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--nh-blue-100);color:var(--tx-strong)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--sb) minmax(0,1fr);min-height:100vh}
.shell.has-toc{grid-template-columns:var(--sb) minmax(0,1fr) var(--toc)}

/* ---------- sidebar ---------- */
.sb{position:sticky;top:0;height:100vh;background:var(--rail);border-right:1px solid var(--rail-bd);display:flex;flex-direction:column;overflow:hidden}
.sb-brand{padding:20px 18px 16px;border-bottom:1px solid var(--rail-bd);cursor:pointer;background:none;border-left:0;border-top:0;border-right:0;text-align:left;width:100%;display:block;transition:background 140ms}
.sb-brand:hover{background:var(--rail-hover)}
.sb-brand .bt{display:flex;align-items:center;gap:8px}
.sb-brand .mark{width:22px;height:22px;border-radius:5px;background:var(--nh-blue-500);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:-.04em;flex:none}
.sb-brand h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.035em;color:var(--tx-strong);line-height:1.3}
.sb-brand .meta{margin-top:7px;font-size:11.5px;line-height:1.6;color:var(--tx-faint);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sb-search{padding:14px 16px 10px}
.sb-search .wrap{position:relative}
.sb-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tx-faint);pointer-events:none}
.sb-search input{width:100%;height:38px;padding:0 30px 0 33px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx-strong);font-family:inherit;font-size:13.5px;letter-spacing:-.01em;outline:none;transition:border-color 140ms,box-shadow 140ms}
.sb-search input::placeholder{color:var(--tx-faint)}
.sb-search input:focus{border-color:var(--nh-blue-500);box-shadow:0 0 0 3px var(--nh-blue-50)}
.sb-search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:0;background:none;color:var(--tx-faint);font-size:15px;line-height:1;border-radius:5px;display:none;align-items:center;justify-content:center}
.sb-search .clr:hover{background:var(--sunken);color:var(--tx-body)}
.sb-search.filled .clr{display:flex}
.sb-roles{padding:0 16px 12px;border-bottom:1px solid var(--rail-bd)}
.sb-roles .lbl{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--tx-faint);margin-bottom:7px}
.seg{display:flex;background:var(--sunken);border-radius:7px;padding:2.5px;gap:2px}
.seg button{flex:1;height:27px;border:0;background:none;border-radius:5px;font-size:11.5px;font-weight:600;letter-spacing:-.02em;color:var(--tx-muted);white-space:nowrap;transition:all 140ms}
.seg button:hover{color:var(--tx-body)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--tx-strong);font-weight:700;box-shadow:var(--shadow-sm)}
.sb-nav{flex:1;overflow-y:auto;padding:10px 10px 24px;scrollbar-width:thin}
.sb-nav::-webkit-scrollbar{width:9px}
.sb-nav::-webkit-scrollbar-thumb{background:var(--bd);border-radius:9px;border:3px solid var(--rail)}
.sb-nav::-webkit-scrollbar-thumb:hover{background:var(--bd-strong)}
.grp{margin-bottom:6px}
.grp-h{display:flex;align-items:center;gap:6px;width:100%;padding:8px 8px 6px;border:0;background:none;text-align:left}
.grp-h .cv{color:var(--tx-faint);transition:transform 160ms;flex:none}
.grp.closed .cv{transform:rotate(-90deg)}
.grp-h .tt{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--tx-muted)}
.grp-h .ct{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--tx-faint);font-variant-numeric:tabular-nums}
.grp.closed .grp-b{display:none}
.grp.fr .grp-h .tt{color:var(--nh-blue-600)}

.nl{display:flex;align-items:center;gap:7px;width:100%;padding:6px 9px;border:0;background:none;border-radius:6px;text-align:left;color:var(--tx-body);font-size:13px;letter-spacing:-.015em;line-height:1.4;transition:background 120ms,color 120ms;position:relative}
.nl:hover{background:var(--rail-hover);color:var(--tx-strong)}
.nl.on{background:var(--rail-active);color:var(--nh-blue-700);font-weight:700}
.nl.on::before{content:"";position:absolute;left:-10px;top:5px;bottom:5px;width:3px;border-radius:0 3px 3px 0;background:var(--nh-blue-500)}
.nl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nl .dot{width:5px;height:5px;border-radius:50%;background:var(--nh-blue-500);flex:none}
.nl.dim{opacity:.32}
.frid{flex:none;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0;padding:1.5px 5px;border-radius:4px;background:var(--sunken);color:var(--tx-muted);border:1px solid var(--bd-subtle)}
.nl.on .frid{background:var(--nh-blue-100);color:var(--nh-blue-700);border-color:transparent}
.trio{display:flex;gap:2.5px;flex:none}
.trio i{width:6px;height:6px;border-radius:2px;display:block}
.trio i.done{background:var(--st-done-dot)}
.trio i.partial{background:var(--st-part-dot)}
.trio i.todo{background:var(--st-todo-dot)}
.sub{padding:2px 0 6px 20px;display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--bd-subtle);margin-left:14px}
.sub button{border:0;background:none;text-align:left;padding:4px 8px;border-radius:5px;font-size:12px;color:var(--tx-muted);letter-spacing:-.015em;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background 120ms,color 120ms}
.sub button:hover{background:var(--rail-hover);color:var(--tx-body)}
.sb-foot{border-top:1px solid var(--rail-bd);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.sb-foot .v{font-size:11px;color:var(--tx-faint);font-variant-numeric:tabular-nums}
.tgl{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--bd);border-radius:999px;background:var(--card);color:var(--tx-body);font-size:11.5px;font-weight:600;letter-spacing:-.01em;transition:border-color 140ms,color 140ms}
.tgl:hover{border-color:var(--nh-blue-500);color:var(--nh-blue-600)}

/* ---------- main ---------- */
.main{min-width:0;padding:0 0 96px}
.inner{max-width:1000px;margin:0 auto;padding:0 40px}
.wide .inner{max-width:1180px}

/* cover */
.cover-h{padding:52px 0 30px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--nh-blue-600);margin-bottom:12px}
.cover-h h2{margin:0;font-size:40px;font-weight:800;letter-spacing:-.045em;color:var(--tx-strong);line-height:1.18}
.cover-h p{margin:12px 0 0;font-size:16px;color:var(--tx-muted);letter-spacing:-.015em;max-width:620px;text-wrap:pretty}

.sect-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:14px;border-bottom:2px solid var(--nh-navy-800);margin-bottom:0}
.sect-h h3{margin:0;font-size:21px;font-weight:800;letter-spacing:-.035em;color:var(--tx-strong)}
.sect-h .sum{font-size:12.5px;color:var(--tx-muted);letter-spacing:-.01em;font-variant-numeric:tabular-nums;padding-bottom:2px;white-space:nowrap}
.sect-h .sum b{color:var(--tx-strong);font-weight:700}

/* filter bar */
.fbar{background:var(--card);border:1px solid var(--bd-subtle);border-top:0;border-radius:0 0 12px 12px;box-shadow:var(--shadow-sm);margin-bottom:20px}
.fgrid{display:flex;flex-wrap:wrap;gap:0;padding:4px 0}
.fdim{padding:10px 18px;border-right:1px solid var(--bd-subtle);display:flex;flex-direction:column;gap:7px}
.fdim:last-of-type{border-right:0}
.fdim .lbl{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--tx-faint)}
.chips{display:flex;gap:5px}
.chip{height:28px;padding:0 11px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx-body);font-size:12.5px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;transition:all 140ms;display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--nh-blue-300);color:var(--nh-blue-600)}
.chip[aria-pressed="true"]{background:var(--nh-navy-800);border-color:var(--nh-navy-800);color:#fff}
html[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--nh-blue-600);border-color:var(--nh-blue-600);color:#08121c}
.chip.solo[aria-pressed="true"]{background:var(--amber-50);border-color:var(--amber-600);color:var(--amber-600)}
.fbar-foot{display:flex;align-items:center;gap:10px;padding:9px 18px;border-top:1px solid var(--bd-subtle);background:var(--sunken);border-radius:0 0 11px 11px;min-height:42px;flex-wrap:wrap}
.fbar-foot .st{font-size:12.5px;color:var(--tx-muted);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.fbar-foot .st b{color:var(--tx-strong);font-weight:700}
.act{display:flex;align-items:center;gap:5px;height:24px;padding:0 4px 0 9px;border-radius:5px;background:var(--card);border:1px solid var(--bd);font-size:11.5px;font-weight:600;color:var(--tx-body);letter-spacing:-.01em}
.act i{font-style:normal;color:var(--tx-faint);font-weight:500}
.act button{width:16px;height:16px;border:0;background:none;color:var(--tx-faint);font-size:13px;line-height:1;border-radius:3px;display:flex;align-items:center;justify-content:center;padding:0}
.act button:hover{background:var(--sunken);color:var(--red-600)}
.reset{margin-left:auto;height:26px;padding:0 10px;border:0;background:none;color:var(--tx-muted);font-size:12px;font-weight:600;border-radius:5px;text-decoration:underline;text-underline-offset:2px}
.reset:hover{color:var(--tx-strong)}

/* feature cards */
.fgridcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(304px,1fr));gap:14px}
.fc{background:var(--card);border:1px solid var(--bd-subtle);border-radius:12px;box-shadow:var(--shadow-sm);text-align:left;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow 160ms,border-color 160ms,transform 160ms}
.fc:hover{box-shadow:var(--shadow-md);border-color:var(--nh-blue-300);transform:translateY(-1px)}
.fc-top{padding:15px 17px 0;display:flex;align-items:center;gap:7px}
.fc-id{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--nh-navy-800);color:#fff;letter-spacing:0}
html[data-theme="dark"] .fc-id{background:var(--nh-blue-600);color:#08121c}
.fc-ph{font-size:11px;font-weight:700;color:var(--tx-muted);letter-spacing:-.01em;padding:2px 6px;border-radius:4px;background:var(--sunken);border:1px solid var(--bd-subtle);font-variant-numeric:tabular-nums}
.fc-q{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--amber-600);background:var(--amber-50);border:1px solid var(--amber-100);padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.fc-body{padding:9px 17px 14px;flex:1;display:flex;flex-direction:column}
.fc-body h4{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.032em;color:var(--tx-strong);line-height:1.35}
.fc-body p{margin:5px 0 0;font-size:12.5px;line-height:1.6;color:var(--tx-muted);letter-spacing:-.012em;text-wrap:pretty}
.fc-meta{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11.5px;line-height:1.55;padding-top:10px;border-top:1px dashed var(--bd-subtle)}
.fc-meta dt{color:var(--tx-faint);font-weight:700;letter-spacing:.02em}
.fc-meta dd{margin:0;color:var(--tx-body);letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-meta dd.mono{font-family:var(--mono);font-size:11px}

/* the three-stage rail — the loudest thing on the card */
.rail3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bd-subtle);border-top:1px solid var(--bd-subtle);margin-top:auto}
.rail3 .st{background:var(--card);padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;cursor:default}
.rail3 .st .bar{width:100%;height:4px;border-radius:999px;background:var(--st-todo-dot)}
.rail3 .st .nm{font-size:11.5px;font-weight:700;letter-spacing:-.02em;color:var(--tx-faint)}
.rail3 .st.done{background:var(--st-done-bg)}
.rail3 .st.done .bar{background:var(--st-done-dot)}
.rail3 .st.done .nm{color:var(--st-done-fg)}
.rail3 .st.partial{background:var(--st-part-bg)}
.rail3 .st.partial .bar{background:linear-gradient(90deg,var(--st-part-dot) 0 55%,var(--st-part-bd) 55% 100%)}
.rail3 .st.partial .nm{color:var(--st-part-fg)}
.rail3 .st.todo .nm{color:var(--st-todo-fg)}
.rail3 .st[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--nh-navy-900);color:#fff;font-size:11.5px;font-weight:600;letter-spacing:-.01em;padding:5px 9px;border-radius:6px;white-space:nowrap;z-index:30;box-shadow:var(--shadow-md);pointer-events:none}
.rail3 .st[data-tip]:hover::before{content:"";position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--nh-navy-900);z-index:30;pointer-events:none}
.empty{grid-column:1/-1;padding:56px 20px;text-align:center;color:var(--tx-muted);font-size:14px;background:var(--card);border:1px dashed var(--bd);border-radius:12px}

/* role entries */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:44px}
.role{background:var(--card);border:1px solid var(--bd-subtle);border-radius:12px;box-shadow:var(--shadow-sm);padding:24px 26px 22px;border-top:3px solid var(--nh-navy-800)}
.role.dev{border-top-color:var(--nh-green-500)}
.role h4{margin:0;font-size:17px;font-weight:800;letter-spacing:-.032em;color:var(--tx-strong)}
.role p{margin:5px 0 16px;font-size:13px;color:var(--tx-muted);letter-spacing:-.012em}
.role ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1px}
.role li button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border:0;background:none;border-radius:6px;text-align:left;font-size:13.5px;color:var(--tx-body);letter-spacing:-.015em;transition:background 120ms,color 120ms}
.role li button:hover{background:var(--sunken);color:var(--nh-blue-600)}
.role li button .ar{margin-left:auto;color:var(--tx-faint);font-size:12px}
.role li button:hover .ar{color:var(--nh-blue-600)}

/* doc view */
.doc-h{padding:44px 0 0}
.crumb{font-size:12px;color:var(--tx-faint);letter-spacing:-.01em;margin-bottom:10px}
.doc-h h2{margin:0;font-size:32px;font-weight:800;letter-spacing:-.042em;color:var(--tx-strong);line-height:1.24}
.doc-h .lede{margin:11px 0 0;font-size:15.5px;line-height:1.7;color:var(--tx-muted);letter-spacing:-.015em;max-width:660px;text-wrap:pretty}
.metachips{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;padding-bottom:22px;border-bottom:1px solid var(--bd-subtle)}
.mchip{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 9px;border-radius:5px;background:var(--sunken);border:1px solid var(--bd-subtle);font-size:11.5px;font-weight:600;color:var(--tx-muted);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.mchip b{color:var(--tx-body);font-weight:700}
.mchip.hi{background:var(--nh-blue-50);border-color:var(--nh-blue-100);color:var(--nh-blue-700)}
.mchip.hi::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--nh-blue-500)}

/* canon band — the hero device of the doc view */
.canon{margin:24px 0 30px;background:var(--card);border:1px solid var(--bd-subtle);border-left:3px solid var(--nh-navy-800);border-radius:10px;box-shadow:var(--shadow-md);overflow:hidden}
html[data-theme="dark"] .canon{border-left-color:var(--nh-blue-500)}
.canon-h{display:flex;align-items:center;gap:9px;padding:12px 20px;background:var(--sunken);border-bottom:1px solid var(--bd-subtle)}
.canon-h .t{font-size:13px;font-weight:800;letter-spacing:-.02em;color:var(--tx-strong)}
.canon-h .d{font-size:11.5px;color:var(--tx-faint);letter-spacing:-.01em}
.canon-h .rail-mini{margin-left:auto;display:flex;gap:5px}
.rmini{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:5px;font-size:11.5px;font-weight:700;letter-spacing:-.015em;border:1px solid}
.rmini::before{content:"";width:6px;height:6px;border-radius:50%}

    var r = el("button","reset","조건 모두 해제");
    r.onclick = function(){ S.f={phase:"all",proto:"all",area:"all",open:false}; coverRender() };
    foot.appendChild(r);
  }
  bar.appendChild(foot); inner.appendChild(bar);

  /* cards */
  var cards = el("div","fgridcards");
  if(!vis.length){
    cards.appendChild(el("div","empty","조건에 맞는 기능이 없습니다. 조건을 완화해 주세요."));
  } else vis.forEach(function(f){
    var c = el("button","fc");
    var top = '<div class="fc-top"><span class="fc-id">'+f.id+'</span><span class="fc-ph">'+f.phases.join("·")+'</span>'
      + (f.open ? '<span class="fc-q">❓ '+f.open+'</span>' : '') + '</div>';
    var body = '<div class="fc-body"><h4>'+esc(f.name)+'</h4><p>'+esc(f.summary)+'</p>'
      + '<dl class="fc-meta">'
      + '<dt>US</dt><dd>'+esc(f.us)+'</dd>'
      + '<dt>화면</dt><dd>'+esc(f.screens)+'</dd>'
      + '<dt>API</dt><dd class="mono">'+esc(f.api)+'</dd>'
      + '<dt>티켓</dt><dd>'+esc(f.ticket)+'</dd></dl></div>';
    var rail = '<div class="rail3">' + ["design","proto","ops"].map(function(k){
      var v = f.stages[k];
      return '<span class="st '+v+'" data-tip="'+STAGE_LABEL[k]+' — '+STATE_LABEL[v]+'"><span class="bar"></span><span class="nm">'+STAGE_LABEL[k]+'</span></span>';
    }).join("") + '</div>';
    c.innerHTML = top + body + rail;
    c.onclick = function(){ go("#"+f.id) };
    cards.appendChild(c);
  });
  inner.appendChild(cards);

  /* role entries */
  var roles = el("div","roles");
  ROLES.forEach(function(r){
    var box = el("div","role" + (r.id==="dev" ? " dev":""));
    box.innerHTML = '<h4>'+esc(r.label)+'</h4><p>'+esc(r.desc)+'</p>';
    var ul = el("ul");
    r.docs.forEach(function(id){
      var d = DOCMAP[id]; if(!d) return;
      var li = el("li"); var b = el("button");
      b.innerHTML = '<span>'+esc(d.title)+'</span>' + (d.changed ? '<span class="dot" style="width:5px;height:5px;border-radius:50%;background:var(--nh-blue-500)"></span>' : '') + '<span class="ar">›</span>';
      b.onclick = function(){ go("#"+id) };
      li.appendChild(b); ul.appendChild(li);
    });
    box.appendChild(ul); roles.appendChild(box);
  });
  inner.appendChild(roles);
  m.appendChild(inner);
  tocRender(null);
}

/* ============================================================ DOC VIEW */
/* 링크 띠 그룹. 빌드가 f.links 를 주입하면 그것을 쓴다 — 문서 단위가 아니라
   US-020 · S03 같은 식별자로 찾아낸 정확한 헤딩 앵커까지 담겨 있다.
   주입이 없으면(이 파일을 단독으로 열어 디자인만 볼 때) CANON 으로 문서 단위 링크를 만든다. */
function railGroups(f){
  if(f.links) return f.links;
  function grp(key, texts, mono){
    return { key:CANON[key].label, mono:!!mono,
             links:texts.filter(Boolean).map(function(t){ return { label:t, href:"#"+CANON[key].doc } }) };
  }
  return [
    grp("req", [f.id+" 요구 항목"]),
    grp("us",  f.us ? f.us.split(", ") : []),
    grp("sc",  [f.screens]),
    grp("api", [f.api], true),
    grp("bl",  [f.ticket]),
    grp("q",   f.open ? Array.from({length:f.open}).map(function(_,i){ return "OI-"+f.id.slice(3)+"-"+(i+1) }) : [])
  ];
}

function docRender(id){
  var d = DOCMAP[id]; if(!d){ coverRender(); return }
  var m = $("#main"); m.className="main"; m.innerHTML="";
  var inner = el("div","inner");

  var h = el("div","doc-h");
  h.innerHTML = '<div class="crumb">'+esc(d.group)+' <span style="color:var(--bd)">›</span> '+esc(d.feature ? d.feature : d.id)+'</div>'
    + '<h2>'+esc(d.title)+'</h2><p class="lede">'+esc(d.lede)+'</p>';
  var chips = el("div","metachips");
  /* 문서마다 마지막으로 바뀐 시점이 다르다. 저장소 HEAD(BUILD)로 갈음하지 않는다. */
  chips.innerHTML = '<span class="mchip"><b class="mono">'+esc(d.commit || BUILD.commit)+'</b></span>'
    + '<span class="mchip">최종 수정 <b>'+esc(d.date || BUILD.date)+'</b></span>'
    + '<span class="mchip">작성 <b>'+esc(d.author)+'</b></span>'
    + '<span class="mchip mono">'+esc(d.path)+'</span>'
    + '<span class="mchip">'+d.size+'</span>'
    + (d.changed ? '<span class="mchip hi">이번 커밋에서 수정됨</span>' : '');
  h.appendChild(chips); inner.appendChild(h);

  if(d.feature){
    var f = FEATMAP[d.feature];
    var band = el("div","canon");
    band.innerHTML = '<div class="canon-h"><span class="t">이 기능 관련 정본</span><span class="d">본 문서와 상충하면 아래 문서를 우선합니다</span>'
      + '<span class="rail-mini">' + ["design","proto","ops"].map(function(k){
          return '<span class="rmini '+f.stages[k]+'">'+STAGE_LABEL[k]+' · '+STATE_LABEL[f.stages[k]]+'</span>' }).join("") + '</span></div>';
    var b = el("div","canon-b");
    railGroups(f).forEach(function(g){
      var box = el("div","cgrp" + (g.key==="미결" ? " q":""));
      box.appendChild(el("div","gl",g.key));
      var gi = el("div","gi");
      if(!g.links.length) gi.appendChild(el("span","none","없음"));
      else g.links.forEach(function(t){
        var bt = el("button",null,t.label); if(g.mono) bt.style.fontFamily="var(--mono)", bt.style.fontSize="12px";
        bt.onclick = function(){ go(t.href) };
        gi.appendChild(bt);
      });
      box.appendChild(gi); b.appendChild(box);
    });
    band.appendChild(b); inner.appendChild(band);
  }

  var md = el("div","md"); md.innerHTML = d.body;
  Array.prototype.forEach.call(md.querySelectorAll("table"), function(t){
    var w = el("div","tw"), sc = el("div","tw-scroll");
    t.parentNode.insertBefore(w,t); sc.appendChild(t); w.appendChild(sc);
    var upd = function(){ w.classList.toggle("more", sc.scrollWidth - sc.clientWidth - sc.scrollLeft > 8) };
    sc.addEventListener("scroll", upd); setTimeout(upd,0);
  });
  inner.appendChild(md);
  m.appendChild(inner);
  tocRender(d);
}

/* ============================================================ TOC */
var spy = null;
function tocRender(d){
  var t = $("#toc"), shell = $("#shell");
  if(spy){ spy.disconnect(); spy = null }
  if(!d || !d.headings.length){ shell.classList.remove("has-toc"); t.innerHTML=""; return }
  shell.classList.add("has-toc");
  t.innerHTML = '<div class="h">이 문서</div>';
  var ul = el("ul");
  d.headings.forEach(function(x){
    var li = el("li", x.lv===3 ? "l3":"");
    var b = el("button",null,x.text);
    b.dataset.a = x.id;
    b.onclick = function(){ jump(x.id) };
    li.appendChild(b); ul.appendChild(li);
  });
  t.appendChild(ul);
  var btns = Array.prototype.slice.call(t.querySelectorAll("button"));
  spy = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting) return;
      btns.forEach(function(b){ b.classList.toggle("on", b.dataset.a === e.target.id) });
    });
  },{ rootMargin:"0px 0px -72% 0px", threshold:0 });
  d.headings.forEach(function(x){ var n=document.getElementById(x.id); if(n) spy.observe(n) });
}
function jump(a){
  var n = document.getElementById(a);
  if(n){ window.scrollTo({ top: n.getBoundingClientRect().top + window.pageYOffset - 20, behavior:"smooth" }) }
  if(location.hash.slice(1) !== a) history.pushState(null,"","#"+a);
}

/* ============================================================ SEARCH */
function searchRender(q){
  var m = $("#main"); m.className="main"; m.innerHTML="";
  var inner = el("div","inner");
  var needle = q.toLowerCase(), hits = [];
  for(var i=0;i<INDEX.length && hits.length<400;i++){
    var e = INDEX[i], p = e.text.toLowerCase().indexOf(needle);
    if(p>=0) hits.push({ e:e, p:p });
  }
  var h = el("div","sr-h");
  var t = el("h2"); t.appendChild(document.createTextNode('"'));
  var em = el("em",null,q); t.appendChild(em);
  t.appendChild(document.createTextNode('" 검색 결과 ' + hits.length + '건'));
  h.appendChild(t);
  h.appendChild(el("div","c", hits.length>60 ? "관련도 순 상위 60건을 표시합니다." : "모든 결과를 표시합니다."));
  inner.appendChild(h);

  if(!hits.length){
    inner.appendChild(el("div","sr-none","일치하는 내용이 없어요."));
  } else {
    var list = el("div","sr-list");
    hits.slice(0,60).forEach(function(hit){
      var e = hit.e, d = DOCMAP[e.doc];
      var b = el("button","sr");
      var src = el("div","src");
      src.appendChild(el("span","kind", e.kind));
      var bb = el("b",null,d.title); src.appendChild(bb);
      b.appendChild(src);
      var sn = el("div","snip");
      var start = Math.max(0, hit.p-42), pre = e.text.slice(start, hit.p);
      if(start>0) sn.appendChild(document.createTextNode("… "));
      sn.appendChild(document.createTextNode(pre));
      var mk = el("mark", null, e.text.substr(hit.p, q.length)); sn.appendChild(mk);
      var post = e.text.slice(hit.p+q.length, hit.p+q.length+120);
      sn.appendChild(document.createTextNode(post));
      if(e.text.length > hit.p+q.length+120) sn.appendChild(document.createTextNode(" …"));
      b.appendChild(sn);
      b.onclick = function(){ $("#q").value=""; $("#searchWrap").classList.remove("filled"); S.q=""; go("#" + (e.anchor || e.doc)) };
      list.appendChild(b);
    });
    inner.appendChild(list);
  }
  m.appendChild(inner);
  tocRender(null);
}

/* ============================================================ ROUTER */
function go(hash){ if(location.hash === hash) route(); else location.hash = hash }
function route(){
  var a = decodeURIComponent(location.hash.slice(1));
  if(S.q.length>=2){ searchRender(S.q); navRender(); return }
  if(!a){ S.view="cover"; S.doc=null; coverRender(); navRender(); window.scrollTo(0,0); return }
  var doc = DOCMAP[a], anchor = null;
  if(!doc){
    for(var i=0;i<DOCS.length;i++){
      if(DOCS[i].headings.some(function(h){return h.id===a})){ doc = DOCS[i]; anchor = a; break }
    }
  }
  if(!doc){ S.view="cover"; S.doc=null; coverRender(); navRender(); return }
  S.view="doc"; S.doc=doc.id;
  docRender(doc.id); navRender();
  if(anchor){ var n=document.getElementById(anchor); if(n) window.scrollTo(0, n.getBoundingClientRect().top + window.pageYOffset - 20) }
  else window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* ============================================================ WIRING */
$("#brandBtn").onclick = function(){ $("#q").value=""; S.q=""; $("#searchWrap").classList.remove("filled"); go("#") };
$("#docCount").textContent = DOCS.length;
$("#buildCommit").textContent = BUILD.commit;
$("#buildDate").textContent = BUILD.date;
$("#buildVersion").textContent = BUILD.version;

var qt;
$("#q").addEventListener("input", function(e){
  var v = e.target.value.trim();
  $("#searchWrap").classList.toggle("filled", !!e.target.value);
  clearTimeout(qt);
  qt = setTimeout(function(){
    var was = S.q.length>=2;
    S.q = v;
    if(v.length>=2){ searchRender(v); navRender(); window.scrollTo(0,0) }
    else if(was){ route(); window.scrollTo(0,0) }
  }, 120);
});
$("#clrBtn").onclick = function(){ $("#q").value=""; S.q=""; $("#searchWrap").classList.remove("filled"); route(); $("#q").focus() };

Array.prototype.forEach.call($("#roleSeg").children, function(b){
  b.onclick = function(){
    S.role = b.dataset.role;
    Array.prototype.forEach.call($("#roleSeg").children, function(x){ x.setAttribute("aria-pressed", x===b ? "true":"false") });
    navRender();
  };
});

var THEME_KEY = "wc-doc-theme";
function setTheme(t){
  document.documentElement.dataset.theme = t;
  $("#themeTxt").textContent = t==="dark" ? "라이트 모드" : "다크 모드";
  $("#themeIco").textContent = t==="dark" ? "◑" : "◐";
  try{ localStorage.setItem(THEME_KEY, t) }catch(e){}
}
$("#themeBtn").onclick = function(){ setTheme(document.documentElement.dataset.theme==="dark" ? "light":"dark") };
try{ setTheme(localStorage.getItem(THEME_KEY)==="dark" ? "dark":"light") }catch(e){ setTheme("light") }

route();
</script>
